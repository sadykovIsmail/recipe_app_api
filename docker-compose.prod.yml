version: '3.9'

x-app-common: &app-common
  build:
    context: .
    args:
      DEV: "false"
  restart: unless-stopped
  volumes:
    - prod-static-data:/vol/web
  environment:
    - SECRET_KEY=${SECRET_KEY}
    - DEBUG=False
    - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    - DB_HOST=db
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASS=${DB_PASS}
    - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    - CORS_ALLOW_ALL_ORIGINS=False
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/0
    - LOG_LEVEL=INFO
    - SECURE_SSL_REDIRECT=False
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - backend

services:
  app:
    <<: *app-common
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn app.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --threads 2
               --worker-class gthread
               --timeout 120
               --access-logfile -
               --error-logfile -"

  celery:
    <<: *app-common
    command: >
      sh -c "python manage.py wait_for_db &&
             celery -A app worker --loglevel=info --concurrency=4 -Q default,images"

  celery-beat:
    <<: *app-common
    command: >
      sh -c "python manage.py wait_for_db &&
             celery -A app beat --loglevel=info
               --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - prod-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.example.com}
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:13-alpine
    restart: unless-stopped
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  proxy:
    image: nginx:1.23-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - prod-static-data:/vol/web:ro
    depends_on:
      - app
      - frontend
    networks:
      - backend

volumes:
  prod-db-data:
  prod-static-data:
  prod-redis-data:

networks:
  backend:
    driver: bridge
